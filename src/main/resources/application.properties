server.port=8081

# spring.application.name=mallapi
#spring.datasource.driver-classname=org.mariadb.jdbc.Driver
#spring.datasource.url=jdbc:mariadb://localhost:3307/malldb

spring.datasource.driver-classname=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:mariadb://localhost:3307/malldb
spring.datasource.username=malldbuser
spring.datasource.password=malldbuser
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.max-file-size=10MB
org.zerock.upload.path=upload

logging.level.org.springframework.security.web=trace

logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=20
logging.level.root=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{15} - %msg%n